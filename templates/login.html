<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/login.css">
    <title>Inicio de sesión</title>
</head>
<body>
    <main>
    <div class="image-box"></div>
    <div class="form-box">
        <form id="login-form" method="POST">
            <h3>Iniciar sesión</h3> <!--Titulo del login-->

            <label for="username">Nombre de usuario: </label><br> <!-- Etiqueta para el usuario -->
            <input type="text" name="username" id="username" required><br> <!-- Campo de texto para el usuario -->

            <label for="password">Contraseña: </label><br> <!-- Etiqueta para la contrasena -->
            <input type="password" name="password" id="password" required><br> <!-- Campo de texto para la contrasena -->

            <div class="buttons">
                <button class="button-login" type="submit">Enviar</button> <!-- Boton de envio -->
                <a class="button-login" href="index.html">Cancelar</a> <!-- Enlace de cancelar -->
            </div>
        </form>
    </div>
</main>
</body>
</html>
