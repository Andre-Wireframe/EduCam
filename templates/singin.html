<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/login.css">
    <title>Registro</title>
</head>
<body>
    <main>
        <div class="image-box"></div>
        <div class="form-box">
            <form id="login-form" method="POST">
                <h3>Registro</h3>

                <label for="username">Nombre de usuario: </label><br>
                <input type="text" name="username" id="username" required><br>

                <label for="password">Contraseña: </label><br>
                <input type="password" name="password" id="password" required><br>

                <label for="password">Contraseña: </label><br>
                <input type="password" name="password" id="password" required><br>

                <label for="pp">
                    He leído y acepto la política de privacidad
                    <input type="checkbox" name="pp" id="pp" required>
                </label>
                <br>
                <label for="ts">
                    He leído y acepto los términos de servicio
                    <input type="checkbox" name="ts" id="ts" required>
                </label>

                <div class="buttons">
                    <button class="button-login" type="submit">Enviar</button>
                    <a class="button-login" href="index.html">Cancelar</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
