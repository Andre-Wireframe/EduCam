<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/login.css">
    <title>EduCam-Singin</title>
</head>
<body>
    <main>
        <div class="image-box"></div>
        <div class="form-box">
            <form id="login-form" method="POST">
                <h3>Registro</h3>

                <label for="username">Nombre de usuario: </label><br>
                <input type="text" name="username" id="username" required><br>

                <label for="password">Contraseña: </label><br>
                <input type="password" name="password" id="password" required><br>

                <label for="password2">Confirmar contraseña: </label><br>
                <input type="password" name="password2" id="password2" required><br>

                <div class="case">
                    <label for="pl" class="label-check">He leído y acepto la politica de privacidad</label>
                    <input type="checkbox" name="pl" id="pl" required>
                </div>
                <br>
                <div class="case">
                    <label for="ts" class="label-check">He leído y acepto los términos de servicio</label>
                    <input type="checkbox" name="ts" id="ts" required>
                </div>

                <div class="buttons">
                    <button class="button-underline" type="submit">Enviar</button>
                    <a class="button-underline" href="/index.html">Cancelar</a>
                </div>

                <div class="case">
                    <a class="link" href="/templates/singin.html">No tengo cuenta registrarse</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
