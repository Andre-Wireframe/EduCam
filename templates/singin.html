<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/login.css">
    <title>Registro</title>
</head>
<body>
    <main>
        <div class="image-box"></div> <!-- Caja de imagen decorativa -->
        <div class="form-box"> <!-- Contenedor del formulario -->
            <form id="login-form" method="POST"> <!-- Formulario de registro -->
                <h3>Registro</h3> <!-- Titulo del formulario -->

                <label for="username">Nombre de usuario: </label><br> <!-- Etiqueta de usuario -->
                <input type="text" name="username" id="username" required><br> <!-- Campo de texto de usuario -->

                <label for="password">Contraseña: </label><br> <!-- Etiqueta de contrasena -->
                <input type="password" name="password" id="password" required><br> <!-- Campo de contrasena -->

                <label for="password2">Confirmar contraseña: </label><br> <!-- Etiqueta de confirmar contrasena -->
                <input type="password" name="password2" id="password2" required><br> <!-- Campo de confirmar contrasena -->

                <label for="pp" class="label-check"> <!-- Etiqueta para politica de privacidad -->
                    He leído y acepto la política de privacidad  <!-- Texto de la politica -->
                    <input type="checkbox" name="pp" id="pp" required> <!-- Casilla de verificacion de politica -->
                </label>
                <br>
                <label for="ts" class="label-check"> <!-- Etiqueta para terminos de servicio -->
                    He leído y acepto los términos de servicio  <!-- Texto de terminos -->
                    <input type="checkbox" name="ts" id="ts" required> <!-- Casilla de verificacion de terminos -->
                </label>

                <div class="buttons"> <!-- Contenedor de botones -->
                    <button class="button-login" type="submit">Enviar</button> <!-- Boton de envio -->
                    <a class="button-login" href="index.html">Cancelar</a> <!-- Enlace para cancelar -->
                </div>
            </form>
        </div>
    </main>
</body>
</html>
